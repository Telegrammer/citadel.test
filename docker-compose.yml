name: citadel

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${APP_CONFIG__RUN__PORT:-8000}:${APP_CONFIG__RUN__PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - citadel

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    entrypoint: ["./entrypoint-worker.sh"]
    command:
      [
        "celery",
        "-A",
        "setup.celery_app:celery_app",
        "worker",
        "--loglevel=info",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - citadel

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${APP_CONFIG__DB__USER}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__PASSWORD}
      POSTGRES_DB: ${APP_CONFIG__DB__NAME}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${APP_CONFIG__DB__USER} -d ${APP_CONFIG__DB__NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${APP_CONFIG__DB__EXPOSE_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - citadel

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${APP_CONFIG__REDIS__EXPOSE_PORT:-6379}:6379"
    networks:
      - citadel

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    networks:
      - citadel

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pg_data:

networks:
  citadel:
    driver: bridge
