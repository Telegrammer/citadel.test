[project]
name = "vk-test"
version = "0.1.0"
description = "Bot farm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "coverage>=7.13.5",
    "cryptography>=46.0.6",
    "dishka>=1.9.1",
    "faker>=38.2.0",
    "fastapi>=0.135.2",
    "fastapi-error-map>=0.9.10",
    "httpx>=0.28.1",
    "locust>=2.42.5",
    "mypy>=1.19.1",
    "pydantic[email]>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.12.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.7",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.22",
    "testcontainers[postgres]>=4.14.2",
    "celery>=5.6.3",
    "passlib>=1.7.4",
    "faststream>=0.6.7",
    "redis>=7.4.0",
]
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=src/domain",
    "--cov=src/application",
    "--cov=src/infrastructure",
    "--cov=src/presentation",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
]
